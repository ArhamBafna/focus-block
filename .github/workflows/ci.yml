name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies while preparing Rust
        # Rust setup and native package installation are independent. Wait for
        # both before restoring the Rust cache and running the full workspace.
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          (
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
            sudo apt-get update $APT_OPTS
            sudo apt-get install -y $APT_OPTS libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          ) &
          apt_pid=$!
          if ! rustup toolchain install stable --profile minimal --no-self-update; then
            wait "$apt_pid" || true
            exit 1
          fi
          wait "$apt_pid"
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all Rust tests
        run: cargo test --workspace

  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: npm test
      - name: Build desktop frontend
        run: npm run build

  extension-build:
    name: Extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
