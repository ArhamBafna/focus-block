name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        # The hosted runners occasionally blackhole IPv6 to the Ubuntu mirrors,
        # which makes apt sit in this step indefinitely. Force IPv4, bound every
        # connection, retry, and cap the step so a bad mirror fails fast instead
        # of hanging until the job times out.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all Rust tests
        run: cargo test --workspace

  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: npm test
      - name: Build desktop frontend
        run: npm run build

  extension-build:
    name: Extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
