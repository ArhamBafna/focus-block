name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Linux package downloads
        uses: actions/cache@v4
        with:
          path: /tmp/focus-apt-archives
          key: ${{ runner.os }}-${{ runner.arch }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Start Linux dependency installation
        # Install native packages while Rust setup and cache restore run. The
        # following wait step checks the installer result before any tests run.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          nohup bash -c '
            set +e
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
            sudo mkdir -p /tmp/focus-apt-archives/partial &&
              sudo apt-get update $APT_OPTS &&
              sudo apt-get install -y $APT_OPTS -o Dir::Cache::archives=/tmp/focus-apt-archives libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            result=$?
            sudo chown -R "$(id -u):$(id -g)" /tmp/focus-apt-archives || result=1
            printf "%s\n" "$result" > "$RUNNER_TEMP/focus-apt-status.tmp"
            mv "$RUNNER_TEMP/focus-apt-status.tmp" "$RUNNER_TEMP/focus-apt-status"
          ' > "$RUNNER_TEMP/focus-apt.log" 2>&1 < /dev/null &
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for Linux dependencies
        timeout-minutes: 25
        run: |
          set -euo pipefail
          while [ ! -f "$RUNNER_TEMP/focus-apt-status" ]; do
            sleep 1
          done
          cat "$RUNNER_TEMP/focus-apt.log"
          exit "$(cat "$RUNNER_TEMP/focus-apt-status")"
      - name: Run all Rust tests
        run: cargo test --workspace

  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: npm test
      - name: Build desktop frontend
        run: npm run build

  extension-build:
    name: Extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
